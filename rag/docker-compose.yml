services:
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rag-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rag
      RABBITMQ_DEFAULT_PASS: rag-local-password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - chroma_data:/data
volumes:
  rabbitmq_data:
  redis_data:
  chroma_data:
