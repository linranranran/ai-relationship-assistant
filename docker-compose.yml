# ============================================================
# AI 人际关系助手 — Docker Compose
# 一键启动 Neo4j + 应用服务
# ============================================================

services:
  # --- Neo4j 图数据库 ---
  neo4j:
    image: neo4j:5-community
    container_name: relationship-neo4j
    ports:
      - "7474:7474"   # Web UI
      - "7687:7687"   # Bolt 协议
    environment:
      - NEO4J_AUTH=neo4j/password
      # 限制内存（2核4G服务器建议 1G-1.5G）
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
    restart: unless-stopped

